<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구구단</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
    }

    .card {
      width: min(720px, 92vw);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(31, 41, 55, 0.12);
      padding: 24px;
    }

    h1 {
      margin: 0 0 16px;
      text-align: center;
      font-size: 30px;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input {
      width: 120px;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.05);
    }

    .result {
      line-height: 1.8;
      font-size: 18px;
      white-space: pre-line;
      text-align: center;
      min-height: 80px;
    }

    .hint {
      color: #6b7280;
      text-align: center;
      font-size: 14px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>구구단 만들기</h1>
    <div class="controls">
      <label for="dan">몇 단?</label>
      <input id="dan" type="number" min="2" max="12" value="2">
      <button id="show">출력</button>
      <button id="showAll">전체(2~12단)</button>
    </div>
    <div class="result" id="result">원하는 단을 입력하고 출력 버튼을 눌러주세요.</div>
    <p class="hint">예: 2~12 사이 숫자 입력</p>
  </main>

  <script>
    const danInput = document.getElementById('dan');
    const result = document.getElementById('result');
    const showBtn = document.getElementById('show');
    const showAllBtn = document.getElementById('showAll');

    function makeTable(dan) {
      const lines = [];
      for (let i = 1; i <= 9; i += 1) {
        lines.push(`${dan} × ${i} = ${dan * i}`);
      }
      return lines.join('\n');
    }

    function printOneDan() {
      const dan = Number(danInput.value);
      if (!Number.isInteger(dan) || dan < 2 || dan > 12) {
        result.textContent = '2부터 12 사이의 정수를 입력해주세요.';
        return;
      }
      result.textContent = makeTable(dan);
    }

    function printAllDan() {
      const all = [];
      for (let dan = 2; dan <= 12; dan += 1) {
        all.push(`[${dan}단]`);
        all.push(makeTable(dan));
        all.push('');
      }
      result.textContent = all.join('\n');
    }

    showBtn.addEventListener('click', printOneDan);
    showAllBtn.addEventListener('click', printAllDan);

    danInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        printOneDan();
      }
    });
  </script>
</body>
</html>
